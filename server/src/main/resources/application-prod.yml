# 生产环境（--spring.profiles.active=prod 时生效）
#
# 所有敏感值都从环境变量读（systemd EnvironmentFile=/opt/fangke/.env），
# 仓库里只保留占位默认值；真实值见 private/ 目录（不入库）。
# 上线前请逐项确认 docs/16《部署环境与上线检查》里的清单。

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:fangke}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 生产不要用 root，建独立账号，只授权 fangke 库
    username: ${DB_USER:fangke_app}
    password: ${DB_PASSWORD:CHANGE_ME}

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    accesslog:
      enabled: true
      buffered: false
      directory: ${LOG_DIR:logs}
      prefix: access
      suffix: .log
      file-date-format: ""
      pattern: "%t %a %m %U %s %b"

logging:
  level:
    com.fangke: INFO

fangke:
  device:
    # 生产必须校验设备签名（签名 key 与设备端 thirdHttpkey 一致）
    pull-verify-sign: ${DEVICE_PULL_VERIFY_SIGN:true}
    pull-sign-key: ${DEVICE_PULL_SIGN_KEY:CHANGE_ME}
    pull-heart-seconds: ${DEVICE_PULL_HEART_SECONDS:5}
    pull-command-timeout-seconds: 300
    # 设备可达的平台根地址（设备会自己拼 /openapi/v1/...），不要带 /openapi/v1
    pull-public-base-url: ${DEVICE_PULL_PUBLIC_BASE_URL:}
    # 远程管理：仅在平台与设备同网时可用；云端部署连不通属正常
    remote-port: ${DEVICE_REMOTE_PORT:9090}
    remote-password: ${DEVICE_REMOTE_PASSWORD:CHANGE_ME}
    remote-timeout-seconds: 5

  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${S3_BUCKET:fangke}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # 预签名 URL 的对外地址（nginx /media 反代到 MinIO），浏览器够不到 127.0.0.1
    public-base: ${S3_PUBLIC_BASE:}

  jwt:
    # 生产必须换成随机长串，否则 token 可被伪造
    secret: ${JWT_SECRET:CHANGE_ME}
  qr:
    secret: ${QR_SECRET:CHANGE_ME}
