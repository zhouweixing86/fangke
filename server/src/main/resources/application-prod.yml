# 生产环境（--spring.profiles.active=prod 时生效）
#
# 同样是明文，部署时把 CHANGE_ME / <...> 换成现场真实值即可。
# 上线前请逐项确认 docs/16《部署环境与上线检查》里的清单。

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/fangke?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 生产不要用 root，建独立账号，只授权 fangke 库
    username: fangke_app
    password: CHANGE_ME

server:
  port: 8081
  tomcat:
    accesslog:
      enabled: true
      buffered: false
      directory: /www/fangke/logs
      prefix: access
      suffix: .log
      file-date-format: ""
      pattern: "%t %a %m %U %s %b"

logging:
  level:
    com.fangke: INFO

fangke:
  device:
    # 生产必须校验设备签名
    pull-verify-sign: true
    pull-sign-key: CHANGE_ME
    pull-heart-seconds: 5
    pull-command-timeout-seconds: 300
    # 设备可达的平台根地址（设备会自己拼 /openapi/v1/...），不要带 /openapi/v1
    pull-public-base-url: http://<现场平台IP>:8081

  storage:
    endpoint: http://127.0.0.1:9000
    bucket: fangke
    access-key: CHANGE_ME
    secret-key: CHANGE_ME

  jwt:
    # 生产必须换成随机长串，否则 token 可被伪造
    secret: CHANGE_ME
  qr:
    secret: CHANGE_ME
