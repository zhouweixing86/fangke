server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: visitor-server
  # 默认 dev（本机开发 / 真机联调）；上线用 --spring.profiles.active=prod 或环境变量切换
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:fangke}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.fangke: DEBUG

fangke:
  tenant-code: T01

  # 首次启动且账号表为空时创建的管理员（生产用环境变量注入，首次登录后必须改密）
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}

  # 前端独立部署时的跨域来源（生产建议同域部署或由网关统一处理）
  cors-allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:5174
    - http://127.0.0.1:5174
    - http://localhost:5175
    - http://127.0.0.1:5175
  # 通配来源（局域网演示用，逗号分隔），如 http://192.168.*:*；生产留空走上面的精确来源
  cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

  jwt:
    # 生产必须用环境变量注入，禁止把真实密钥写进配置文件
    secret: ${JWT_SECRET:dev-only-change-me}
    ttl: 8h

  qr:
    secret: ${QR_SECRET:dev-only-qr-secret}
    ttl-seconds: 60

  # 访客端/员工端（H5、小程序）
  app:
    # 开发模式：验证码直接回显；生产必须 false 并接入短信网关
    sms-mock: ${APP_SMS_MOCK:true}
    code-ttl-seconds: ${APP_CODE_TTL:300}
    # 是否允许用 X-Employee-Id 头模拟员工身份（仅联调/自动化测试，生产必须 false）
    allow-employee-header: ${APP_ALLOW_EMPLOYEE_HEADER:false}

  # 微信小程序一键登录（访客端）：mock=true 时直接把 code 当 openid，仅供开发联调
  wx:
    app-id: ${WX_APP_ID:}
    secret: ${WX_SECRET:}
    mock: ${WX_MOCK:true}
    # 生成「角色小程序码」用：release 正式 / trial 体验版 / develop 开发版
    env-version: ${WX_ENV_VERSION:release}

  crypto:
    # 敏感字段加密：生产必须用环境变量注入，且两把密钥不同
    aes-key: ${CRYPTO_AES_KEY:dev-only-aes-key-change-me}
    hmac-key: ${CRYPTO_HMAC_KEY:dev-only-hmac-key-change-me}

  device:
    max-retry: 3
    queue-backlog-limit: 200
    # 访客下发时使用的名单类型：white 白名单 / visitor 访客 / black 黑名单
    # 员工固定按 white 下发。访客默认也用 white —— 本机固件（V1.11248/2.2.122）实测
    # 不支持 visitor：下发后不会进白名单，反而被当成黑名单，访客会被拒。
    # 现场靠 company=访客系统 / department=访客 区分员工与访客。
    visitor-user-type: ${DEVICE_VISITOR_USER_TYPE:white}

    # 新终端（HTTP 客户端 / 轮询版）：设备主动来拉，平台只能通过心跳下发 action
    # 签名 key 必须与设备侧「thirdHttpkey」一致，否则设备请求会被判签名错误
    pull-sign-key: ${DEVICE_PULL_SIGN_KEY:fangke-pull-key}
    # 联调期可临时置 false 抓包看报文；生产必须 true
    pull-verify-sign: ${DEVICE_PULL_VERIFY_SIGN:true}
    # 下发给设备的心跳间隔（秒）。越小远程开门越及时，但请求量越大
    pull-heart-seconds: ${DEVICE_PULL_HEART_SECONDS:30}
    # 指令下发后多久没回执就重新排队（秒）
    pull-command-timeout-seconds: ${DEVICE_PULL_COMMAND_TIMEOUT:300}
    # 平台对设备可达的根地址：下发给设备作为二维码推送地址（thirdQrUrl）前缀
    # 例：http://192.168.10.50:8080 ；留空则不自动下发 thirdQrUrl
    pull-public-base-url: ${DEVICE_PULL_PUBLIC_BASE_URL:}

    # 远程管理：平台直连设备 9090 端口调下行接口（读参数 / 校时 / 抓拍 / 弹框 / 重启…）
    # 要求平台与设备同网；云端部署时连不通属正常，界面会引导走「本地管理」
    remote-port: ${DEVICE_REMOTE_PORT:9090}
    remote-password: ${DEVICE_REMOTE_PASSWORD:888888}
    remote-timeout-seconds: ${DEVICE_REMOTE_TIMEOUT:5}
    # 车闸/相机协议抓包（临时排障）：开着时 /openapi/** 未匹配路径也回 200 并留报文，用完必须关
    openapi-probe: ${DEVICE_OPENAPI_PROBE:false}

  # 车闸：云车场开放接口（docs/19）。接口需车场方付费开通；凭据未配置时只算差异不发送
  vehicle:
    cloud:
      enabled: ${VEHICLE_CLOUD_ENABLED:false}
      base-url: ${VEHICLE_CLOUD_BASE_URL:}
      park-id: ${VEHICLE_CLOUD_PARK_ID:}
      secret: ${VEHICLE_CLOUD_SECRET:}
      channel-id: ${VEHICLE_CLOUD_CHANNEL_ID:0}
      visitor-type: ${VEHICLE_CLOUD_VISITOR_TYPE:0}
      timeout-seconds: ${VEHICLE_CLOUD_TIMEOUT:8}
      sync-ms: ${VEHICLE_CLOUD_SYNC_MS:60000}
      sync-initial-delay-ms: ${VEHICLE_CLOUD_SYNC_INITIAL_DELAY_MS:45000}
      employee-as-month-card: ${VEHICLE_CLOUD_EMPLOYEE_MONTH:false}
      auth-type: ${VEHICLE_CLOUD_AUTH_TYPE:0}

    # 车闸相机 MQTT 通道（docs/22）：相机作为客户端连我们云上的 broker
    mqtt:
      enabled: ${VEHICLE_MQTT_ENABLED:true}
      broker-url: ${VEHICLE_MQTT_BROKER_URL:tcp://127.0.0.1:1883}
      username: ${VEHICLE_MQTT_USERNAME:fangke}
      password: ${VEHICLE_MQTT_PASSWORD:}
      client-id: ${VEHICLE_MQTT_CLIENT_ID:fangke-vehicle-gateway}
      upload-topic: ${VEHICLE_MQTT_UPLOAD_TOPIC:upload/+}
      download-topic-prefix: ${VEHICLE_MQTT_DOWNLOAD_PREFIX:download/}
      qos: ${VEHICLE_MQTT_QOS:0}
      retained: ${VEHICLE_MQTT_RETAINED:false}
      # 报文模板：默认按相机「标准协议」信封（command/data，data 是转义后的 JSON 字符串），可在 .env 覆盖
      add-template: ${VEHICLE_MQTT_ADD_TEMPLATE:}
      delete-template: ${VEHICLE_MQTT_DELETE_TEMPLATE:}
      import-template: ${VEHICLE_MQTT_IMPORT_TEMPLATE:}
      # 固定车类型（协议 §5.1）：1 月租车 / 2 产权车 / 3 储值车 / 4 贵宾车(=永不过期) / 5 黑名单 / 6 自定义白名单
      plate-type: ${VEHICLE_MQTT_PLATE_TYPE:1}
      # 下行发布超时（毫秒）：超时即判定连接半死并强制重连，避免接口卡到 nginx 504
      publish-timeout-ms: ${VEHICLE_MQTT_PUBLISH_TIMEOUT_MS:5000}
      # 看门狗间隔（毫秒）：未连接时兜底重建
      watchdog-ms: ${VEHICLE_MQTT_WATCHDOG_MS:30000}

  storage:
    # 照片存对象存储（S3 兼容）。默认指向内网 MinIO —— 照片不出园区。
    # 换云 OSS/COS 只改这四项，业务代码不动。
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${S3_BUCKET:fangke}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:us-east-1}
    # MinIO 必须 path-style，否则预签名 URL 会拼成 bucket.host 而无法访问
    path-style: true
    auto-create-bucket: true
    presign-ttl: 5m
